name: MQTT_Device_Simulator Release

on:
  push:
    tags:
      - 'v*' # 当您 push 类似 v1.0.0 的 tag 时触发发布工作流
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要构建的现有标签，例如 v1.2.1'
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write # 允许写入 Release
    strategy:
      fail-fast: false
      max-parallel: 1 # 串行更新同一个 Release，避免平台并发时覆盖 latest.json。
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: validate release versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $tagVersion = ($env:RELEASE_TAG).TrimStart('v')
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoManifest = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersionMatch = [regex]::Match($cargoManifest, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $cargoVersionMatch.Success) {
            throw "Unable to read src-tauri/Cargo.toml package version."
          }
          $cargoVersion = $cargoVersionMatch.Groups[1].Value
          $versions = @($packageVersion, $tauriVersion, $cargoVersion)
          if (($versions | Where-Object { $_ -ne $tagVersion }).Count -gt 0) {
            throw "Release tag v$tagVersion must match package.json, tauri.conf.json, and Cargo.toml versions. Found: $($versions -join ', ')."
          }
          Write-Host "Validated release version v$tagVersion."

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 安装 Ubuntu 下的 Linux 依赖
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: validate updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "缺少更新签名私钥。请在 GitHub Secrets 中配置 `TAURI_SIGNING_PRIVATE_KEY`，或兼容旧名称 `TAURI_PRIVATE_KEY`。"
          }
          Write-Host "Updater signing key detected."

      - name: generate release notes for this tag
        id: release_notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $payload = @{ tag_name = $env:RELEASE_TAG } | ConvertTo-Json
          $notes = Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $payload
          if ([string]::IsNullOrWhiteSpace($notes.body)) {
            throw "GitHub returned empty release notes for $env:RELEASE_TAG."
          }
          $delimiter = "release_notes_$([guid]::NewGuid().ToString('N'))"
          $output = @("body<<$delimiter") + ($notes.body -split '\r?\n') + @($delimiter)
          Add-Content -Path $env:GITHUB_OUTPUT -Value ($output -join "`n") -Encoding utf8
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'release-notes.md') -Value $notes.body -Encoding utf8

      # 通过官方 tauri-action 编译并上传 updater 元数据
      - name: build and release tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: MQTT_Device_Simulator ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: update release description with generated notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $encodedTag = [uri]::EscapeDataString($env:RELEASE_TAG)
          $release = Invoke-RestMethod -Method Get `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" `
            -Headers $headers
          $releaseBody = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'release-notes.md') -Raw -Encoding utf8
          $payload = @{ body = $releaseBody } | ConvertTo-Json
          Invoke-RestMethod -Method Patch `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $payload | Out-Null

  verify-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: verify platform bundles and updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          asset_names="$(jq -r '.assets[].name' <<< "$release_json")"

          require_asset() {
            local label="$1"
            local pattern="$2"
            if ! grep -Eiq "$pattern" <<< "$asset_names"; then
              printf 'Release %s is missing %s. Assets:\n%s\n' "$RELEASE_TAG" "$label" "$asset_names" >&2
              exit 1
            fi
          }

          require_asset 'latest.json' '^latest\.json$'
          require_asset 'Windows NSIS installer' '-setup\.exe$'
          require_asset 'Linux AppImage' '\.AppImage$'
          require_asset 'Linux DEB package' '\.deb$'
          dmg_count="$(grep -Eic '\.dmg$' <<< "$asset_names" || true)"
          if (( dmg_count < 2 )); then
            printf 'Release %s has %s macOS DMG package(s); expected both Apple Silicon and Intel builds. Assets:\n%s\n' "$RELEASE_TAG" "$dmg_count" "$asset_names" >&2
            exit 1
          fi

          signature_count="$(grep -Eic '\.sig$' <<< "$asset_names" || true)"
          if (( signature_count < 4 )); then
            printf 'Release %s has %s updater signature asset(s); expected signatures for Windows, Linux, and both macOS architectures.\n' "$RELEASE_TAG" "$signature_count" >&2
            exit 1
          fi

          if [[ -z "$(jq -r '.body // empty' <<< "$release_json")" ]]; then
            printf 'Release %s has an empty body; expected generated notes for this tag.\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          printf 'Verified Windows, Linux, macOS, latest.json, %s updater signatures, and release notes for %s.\n' "$signature_count" "$RELEASE_TAG"
